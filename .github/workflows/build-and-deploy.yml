name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Pre-build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run asset-checker
        run: node mcp-tools/asset-checker.js
        continue-on-error: true

      - name: Run config-validator
        run: node mcp-tools/config-validator.js

      - name: Run deps-checker
        run: node mcp-tools/deps-checker.js

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
      - name: Post-build verify
        run: node scripts/post-build-verify.js
        # This automatically runs:
        # - prebuild (runs all MCP tools)
        # - build (vite build)
        # - postbuild (verifies output)

      - name: Verify build output
        run: |
          echo "Checking dist/assets for invalid files..."
          if find dist/assets -name "*.tsx" -o -name "*.jsx" -o -name "*.ts" | grep -v ".d.ts" | grep -q .; then
            echo "❌ Invalid files found in build output!"
            find dist/assets -name "*.tsx" -o -name "*.jsx" -o -name "*.ts" | grep -v ".d.ts"
            exit 1
          fi
          echo "✅ Build output verified: no invalid file extensions"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 1

