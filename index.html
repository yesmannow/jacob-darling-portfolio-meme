    <!-- Theme Init - Zero-FOUC theme loading (must be first script) -->
    <script>
      (function() {
        'use strict';
        try {
          const ls = localStorage.getItem('theme'); // 'light' | 'dark' | 'system'
          const brand = localStorage.getItem('brand') || 'cmo'; // default: cmo
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = ls === 'system' || !ls ? (prefersDark ? 'dark' : 'light') : ls;

          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.setAttribute('data-brand', brand);
        } catch(e) {
          // Silently fail if localStorage is unavailable
        }
      })();
    </script>

    <!-- Make React available early to prevent forwardRef errors -->
    <!-- This runs before any chunks load -->
    <script>
      // Pre-define React placeholder to prevent "Cannot read properties of undefined" errors
      // This will be replaced when React actually loads
      if (typeof window !== 'undefined' && !window.React) {
        window.React = {}; // Placeholder - prevents undefined errors
      }

      // Catch React forwardRef errors early
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes("Cannot read properties of undefined (reading 'forwardRef')") ||
          event.message.includes('forwardRef') ||
          event.message.includes('React is not defined')
        )) {
          // React might not be loaded yet - log but don't crash
          console.warn('React not fully loaded when chunk accessed it - will retry:', event.message);
          event.preventDefault();
          return false;
        }
      }, true);
    </script>
    <!-- Suppress custom element errors - MUST be in head before any scripts -->
    <script>
      (function() {
        'use strict';
        // Wait for DOMContentLoaded or use a small delay to ensure customElements API is available
        function setupCustomElementSuppression() {
          // Check if customElements API is available
          if (typeof window === 'undefined' || !window.customElements) {
            // Retry after a short delay if not available yet
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', setupCustomElementSuppression);
            } else {
              setTimeout(setupCustomElementSuppression, 10);
            }
            return;
          }

          const originalDefine = window.customElements.define;

          // Override customElements.define IMMEDIATELY
          // This implements the exact recommended pattern: check !customElements.get() before defining
          if (originalDefine) {
            window.customElements.define = function(name, constructor, options) {
              // Recommended pattern: Check if element is already defined using customElements.get()
              // This prevents "has already been defined" errors
              try {
                if (window.customElements && typeof window.customElements.get === 'function') {
                  // Explicit check before defining (the suggested fix pattern)
                  if (window.customElements.get(name)) {
                    // Element already exists - return early to prevent duplicate definition
                    return;
                  }

                  // Special check for mce-autosize-textarea (the problematic element)
                  if (name === 'mce-autosize-textarea' && window.customElements.get('mce-autosize-textarea')) {
                    // Already defined - skip redefinition
                    return;
                  }
                }
              } catch (e) {
                // If get() fails, assume not defined and proceed
              }

              // Now safe to define (element doesn't exist yet)
              try {
                return originalDefine.call(this, name, constructor, options);
              } catch (error) {
                // If definition still fails (race condition), catch the error
                const errorMessage = error?.message || String(error || '');
                if (errorMessage.includes('has already been defined') ||
                    errorMessage.includes('custom element') ||
                    String(name || '').includes('mce-') ||
                    String(name || '').includes('autosize-textarea')) {
                  // Silently ignore - element is already registered (likely race condition)
                  return;
                }
                // Re-throw other errors
                throw error;
              }
            };
          }
        }

        // Start setup immediately, will retry if customElements not ready
        setupCustomElementSuppression();

        // Global error handler with capture phase to catch early
        // This MUST use capture phase and stopImmediatePropagation to catch before overlay
        window.addEventListener('error', function(event) {
          const errorMessage = event.error?.message || event.message || '';
          const filename = event.filename || '';

          // Catch custom element errors (especially from overlay_bundle.js)
          if (errorMessage.includes('has already been defined') ||
              errorMessage.includes('mce-autosize-textarea') ||
              errorMessage.includes('custom element') ||
              filename.includes('overlay_bundle') ||
              filename.includes('webcomponents-ce')) {
            // Prevent the error from appearing in console
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }
        }, true); // Capture phase - catches before other handlers

        // Also catch unhandled promise rejections
        // Handle undefined rejections to prevent "Uncaught undefined" errors
        window.addEventListener('unhandledrejection', function(event) {
          // Handle undefined/null rejections
          if (event.reason === undefined || event.reason === null) {
            console.warn('Caught undefined promise rejection (suppressed)');
            event.preventDefault();
            return false;
          }

          const reason = event.reason;
          const errorMessage = reason?.message || String(reason || '');
          if (errorMessage.includes('has already been defined') ||
              errorMessage.includes('mce-autosize-textarea') ||
              errorMessage.includes('custom element')) {
            event.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
