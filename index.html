    <!-- Theme Init - Zero-FOUC theme loading (must be first script) -->
    <script>
      (function() {
        'use strict';
        try {
          const ls = localStorage.getItem('theme'); // 'light' | 'dark' | 'system'
          const brand = localStorage.getItem('brand') || 'cmo'; // default: cmo
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = ls === 'system' || !ls ? (prefersDark ? 'dark' : 'light') : ls;
          const isDark = theme === 'dark';

          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-brand', brand);

          // Update theme-color meta tag immediately (for Chrome/Edge/Safari)
          // Firefox and Opera ignore this tag - we use CSS color-scheme for them instead
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute('content', isDark ? '#0b0b0c' : '#ffffff');
          }

          // Set CSS color-scheme for Firefox/Opera support
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch(e) {
          // Silently fail if localStorage is unavailable
        }
      })();
    </script>

    <!-- Make React available early to prevent forwardRef errors -->
    <!-- This runs before any chunks load -->
    <script>
      // Pre-define React placeholder to prevent "Cannot read properties of undefined" errors
      // This will be replaced when React actually loads
      if (typeof window !== 'undefined') {
        if (!window.React) {
          // Create a more complete placeholder to prevent Children property errors
          // This prevents "Cannot set properties of undefined (setting 'Children')" errors
          window.React = {
            Children: {
              map: function() {},
              forEach: function() {},
              count: function() {},
              toArray: function() {},
              only: function() {}
            },
            Component: function() {},
            Fragment: Symbol.for('react.fragment'),
            createElement: function() {},
            cloneElement: function() {},
            isValidElement: function() {},
            forwardRef: function() {},
            lazy: function() {},
            memo: function() {},
            Suspense: function() {},
            useEffect: function() {},
            useState: function() {},
            useRef: function() {},
            useContext: function() {}
          };
        }
      }

        // Catch React forwardRef errors early
        window.addEventListener('error', function(event) {
          if (event.message && (
            event.message.includes("Cannot read properties of undefined (reading 'forwardRef')") ||
            event.message.includes('forwardRef') ||
            event.message.includes('React is not defined') ||
            event.message.includes("Cannot set properties of undefined (setting 'Children')") ||
            event.message.includes("setting 'Children'") ||
            event.message.includes('React.Children')
          )) {
            // React might not be loaded yet - log but don't crash
            console.warn('React not fully loaded when chunk accessed it - will retry:', event.message);
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
    </script>
    <!-- Suppress custom element errors - MUST be in head before any scripts -->
    <!-- This runs IMMEDIATELY to catch any early registrations -->
    <script>
      (function() {
        'use strict';

        // Override customElements.define IMMEDIATELY - don't wait for DOM
        // This must run before ANY scripts that might define custom elements
        function protectCustomElements() {
          // Check if customElements API is available
          if (typeof window === 'undefined' || !window.customElements) {
            // Retry immediately if not available (should be available in modern browsers)
            if (typeof window !== 'undefined') {
              setTimeout(protectCustomElements, 0);
            }
            return;
          }

          const originalDefine = window.customElements.define;

          // Override customElements.define with the recommended fix pattern
          // Use a more robust check to prevent double-wrapping
          if (originalDefine && !window.customElements._defineProtected) {
            window.customElements._defineProtected = true; // Flag to prevent double-wrapping

            window.customElements.define = function(name, constructor, options) {
              // RECOMMENDED FIX: Check if element is already defined using !customElements.get()
              // This is the exact pattern the user suggested
              if (!customElements.get(name)) {
                // Element doesn't exist - safe to define
                try {
                  return originalDefine.call(this, name, constructor, options);
                } catch (error) {
                  // If definition fails (race condition), check again
                  if (error && (error.message || String(error)).includes('has already been defined')) {
                    // Element was defined between our check and the actual define() call
                    // This is a race condition - silently ignore it (prevents error)
                    return;
                  }
                  // Re-throw non-duplicate errors
                  throw error;
                }
              } else {
                // Element already exists - silently return (prevents "already been defined" error)
                // This is the fix: check BEFORE defining
                // Log in dev mode only for debugging
                if (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'development') {
                  console.debug('[CustomElements] Element already defined, skipping:', name);
                }
                return;
              }
            };
          }
        }

        // PROTECT IMMEDIATELY - run synchronously if possible
        // Try multiple times to ensure we catch it before any scripts load
        protectCustomElements();

        // Also protect after a microtask (catches any that were defined during script parsing)
        if (typeof Promise !== 'undefined' && Promise.resolve) {
          Promise.resolve().then(protectCustomElements);
        }

        // And protect after DOM is ready (if DOM is already ready, this runs immediately)
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', protectCustomElements);
        } else {
          protectCustomElements();
        }

        // Also catch any errors that slip through
        window.addEventListener('error', function(event) {
          const error = event.error;
          const message = (error && error.message) || event.message || '';

          // Catch "already been defined" errors
          if (message.includes('has already been defined') ||
              message.includes('mce-autosize-textarea') ||
              (error && error.name === 'NotSupportedError' && message.includes('custom element'))) {
            // Prevent the error from propagating
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }
        }, true); // Use capture phase to catch early

        // Also catch promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const message = (reason && reason.message) || String(reason || '');

          if (message.includes('has already been defined') ||
              message.includes('mce-autosize-textarea') ||
              (reason && reason.name === 'NotSupportedError' && message.includes('custom element'))) {
            event.preventDefault();
            return;
          }
        });

        // Final attempt after window load (catches late-loading scripts)
        window.addEventListener('load', protectCustomElements);

        // Global error handler with capture phase to catch early
        // This MUST use capture phase and stopImmediatePropagation to catch before overlay
        window.addEventListener('error', function(event) {
          const errorMessage = event.error?.message || event.message || '';
          const filename = event.filename || event.source || '';
          const target = event.target;

          // Catch React Children errors immediately
          if (errorMessage.includes("Cannot set properties of undefined (setting 'Children')") ||
              errorMessage.includes("setting 'Children'") ||
              (errorMessage.includes("Cannot read properties") && errorMessage.includes("undefined"))) {
            // Ensure React placeholder exists
            if (!window.React) window.React = {};
            if (!window.React.Children) {
              window.React.Children = {
                map: function() {},
                forEach: function() {},
                count: function() {},
                toArray: function() {},
                only: function() {}
              };
            }
            event.preventDefault();
            event.stopPropagation();
            if (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'development') {
              console.warn('React Children error caught and suppressed:', errorMessage);
            }
            return false;
          }

          // Catch custom element errors (especially from overlay_bundle.js)
          if (errorMessage.includes('has already been defined') ||
              errorMessage.includes('mce-autosize-textarea') ||
              errorMessage.includes('custom element') ||
              filename.includes('overlay_bundle') ||
              filename.includes('webcomponents-ce') ||
              filename.includes('webcomponents') ||
              (target && target.tagName === 'SCRIPT' && filename.includes('webcomponents')) ||
              String(event.error || '').includes('mce-autosize-textarea')) {
            // Prevent the error from appearing in console
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }

          // Catch MIME type errors for module scripts (can happen during HMR or build issues)
          if (errorMessage.includes('MIME type') ||
              errorMessage.includes('module script') ||
              errorMessage.includes('application/octet-stream') ||
              errorMessage.includes('Expected a JavaScript-or-Wasm module script')) {
            // Prevent MIME type errors from crashing the app
            // This often happens when the server returns wrong Content-Type header
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            // Log in dev but don't crash - might be a temporary build/HMR issue
            if (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'development') {
              console.warn('MIME type warning (suppressed):', errorMessage);
            }

            // Try to reload the script with correct type
            if (event.target && event.target.tagName === 'SCRIPT') {
              const script = event.target;
              if (script.src && !script.hasAttribute('data-retry')) {
                script.setAttribute('data-retry', 'true');
                const newScript = document.createElement('script');
                newScript.type = 'module';
                newScript.src = script.src;
                newScript.setAttribute('data-retry', 'true');
                document.head.appendChild(newScript);
              }
            }
            return false;
          }

          // Catch circular dependency and initialization errors
          if (errorMessage.includes('Cannot access') && errorMessage.includes('before initialization') ||
              errorMessage.includes('ReferenceError') && errorMessage.includes('initialization') ||
              errorMessage.includes('TDZ') || // Temporal Dead Zone errors
              (errorMessage.includes('before initialization') && filename.includes('.js')) ||
              (errorMessage.includes('ReferenceError') && errorMessage.includes('Cannot access'))) {
            // These are often circular dependency issues during HMR - suppress but don't reload
            // Reloading can cause infinite loops, so just suppress the error
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            // Only log in development, and make it a brief warning
            if (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'development') {
              // Use a debounce to avoid console spam
              if (!window.__lastInitErrorTime || Date.now() - window.__lastInitErrorTime > 2000) {
                console.warn('Initialization error (suppressed - likely HMR issue):', errorMessage.substring(0, 100));
                window.__lastInitErrorTime = Date.now();
              }
            }
            return false;
          }
        }, true); // Capture phase - catches before other handlers

        // Also catch unhandled promise rejections
        // Handle undefined rejections to prevent "Uncaught undefined" errors
        window.addEventListener('unhandledrejection', function(event) {
          // Handle undefined/null rejections
          if (event.reason === undefined || event.reason === null) {
            // Only log in development to avoid console noise in production
            if (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'development') {
              console.warn('Caught undefined promise rejection (suppressed)');
            }
            event.preventDefault();
            return false;
          }

          const reason = event.reason;
          const errorMessage = reason?.message || String(reason || '');
          if (errorMessage.includes('has already been defined') ||
              errorMessage.includes('mce-autosize-textarea') ||
              errorMessage.includes('custom element') ||
              String(reason || '').includes('mce-autosize-textarea')) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }

          // Handle React Children errors in promise rejections
          if (errorMessage.includes("Cannot set properties of undefined (setting 'Children')") ||
              errorMessage.includes("setting 'Children'") ||
              errorMessage.includes("Cannot read properties of undefined")) {
            // React deduplication issue - likely temporary during module load
            // Ensure React placeholder is still in place
            if (!window.React || !window.React.Children) {
              if (!window.React) window.React = {};
              window.React.Children = window.React.Children || {
                map: function() {},
                forEach: function() {},
                count: function() {},
                toArray: function() {},
                only: function() {}
              };
            }

            if (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'development') {
              console.warn('React Children error in promise (suppressed):', errorMessage);
            }
            event.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>

    <!-- Enhanced error detection for production -->
    <script>
      // Enhanced error detection to help diagnose loading issues
      window.addEventListener('error', function(e) {
        console.error('Global error caught:', {
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          error: e.error
        });

        // If it's a module loading error, show helpful message
        if (e.message && (e.message.includes('Failed to fetch') ||
                          e.message.includes('module script') ||
                          e.message.includes('MIME type') ||
                          e.message.includes('net::ERR'))) {
          const root = document.getElementById('root');
          if (root && root.querySelector('.initial-loader')) {
            root.innerHTML = `
              <style>
                .error-container {
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 100vh;
                  background: #0A0A0A;
                  color: #FFFFFF;
                  padding: 2rem;
                  text-align: center;
                }
                .error-title {
                  font-size: 1.5rem;
                  margin-bottom: 1rem;
                  color: #EF4444;
                }
                .error-message {
                  opacity: 0.8;
                  margin-bottom: 1rem;
                  font-family: monospace;
                  font-size: 0.9rem;
                }
                .error-button {
                  margin-top: 1rem;
                  padding: 0.75rem 2rem;
                  background: #3B82F6;
                  color: white;
                  border: none;
                  border-radius: 8px;
                  cursor: pointer;
                }
              </style>
              <div class="error-container">
                <div>
                  <h2 class="error-title">Script Loading Error</h2>
                  <p class="error-message">${e.message}</p>
                  <p style="opacity: 0.7; margin-top: 1rem;">
                    The application scripts failed to load. This might be a network issue or a build configuration problem.
                  </p>
                  <button class="error-button" onclick="window.location.reload()">
                    Reload Page
                  </button>
                </div>
              </div>
            `;
          }
        }
      }, true);

      // Also catch unhandled promise rejections
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });

      // Timeout to detect if nothing loads after 15 seconds
      setTimeout(function() {
        const root = document.getElementById('root');
        if (root && root.querySelector('.initial-loader')) {
          console.error('Application failed to load after 15 seconds');
          root.innerHTML = `
            <style>
              .timeout-container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background: #0A0A0A;
                color: #FFFFFF;
                padding: 2rem;
                text-align: center;
              }
              .timeout-title {
                font-size: 1.5rem;
                margin-bottom: 1rem;
                color: #F59E0B;
              }
              .timeout-button {
                margin-top: 1rem;
                padding: 0.75rem 2rem;
                background: #3B82F6;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
              }
            </style>
            <div class="timeout-container">
              <div>
                <h2 class="timeout-title">Loading Timeout</h2>
                <p style="opacity: 0.8; margin-bottom: 1rem;">
                  The application is taking longer than expected to load.
                </p>
                <p style="opacity: 0.6; font-size: 0.9rem; margin-bottom: 1rem;">
                  Please check the browser console (F12) for errors.
                </p>
                <button class="timeout-button" onclick="window.location.reload()">
                  Reload Page
                </button>
              </div>
            </div>
          `;
        }
      }, 15000);
    </script>
